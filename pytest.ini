[pytest]
testpaths = tests
# The suite imports `contracts.*` from the repo root. Without this the
# obvious invocation — `pytest tests/` from the checkout — fails collection
# with ModuleNotFoundError, and the suite only runs for someone who already
# knows to set PYTHONPATH. A test suite that needs an undocumented env var
# reads as a broken one.
pythonpath = .
filterwarnings =
    # algorand-python 4.x deprecates `.native` in favour of `.as_uint64`. The
    # contracts still use `.native` and compile clean under the CI-pinned
    # puyapy 5.9.0; silencing it here keeps a real failure visible in the output.
    ignore:Use `as_uint64` instead:DeprecationWarning
