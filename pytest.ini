[pytest]
testpaths = tests
filterwarnings =
    # algorand-python 4.x deprecates `.native` in favour of `.as_uint64`. The
    # contracts still use `.native` and compile clean under the CI-pinned
    # puyapy 5.9.0; silencing it here keeps a real failure visible in the output.
    ignore:Use `as_uint64` instead:DeprecationWarning
